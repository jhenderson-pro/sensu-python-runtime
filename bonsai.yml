---
description: "Portable CPython runtime for Sensu Go"
builds:
  - platform: "linux"
    arch: "amd64"
    asset_filename: "sensu-python-runtime_#{version}_python-3.13.13_linux_amd64_glibc.tar.gz"
    sha_filename: "sha512-checksums.txt"
    filter:
      - "entity.system.os == 'linux'"
      - "entity.system.arch == 'amd64'"
      - "entity.system.platform != 'alpine'"
  - platform: "alpine"
    arch: "amd64"
    asset_filename: "sensu-python-runtime_#{version}_python-3.13.13_linux_amd64_musl.tar.gz"
    sha_filename: "sha512-checksums.txt"
    filter:
      - "entity.system.os == 'linux'"
      - "entity.system.arch == 'amd64'"
      - "entity.system.platform == 'alpine'"
